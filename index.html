<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>🏖️WXQ私人海滩🏖️</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🏖️WXQ私人海滩🏖️">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Ma+Shan+Zheng&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 口令 -->
  <div class="gate" id="gate" hidden>
    <form class="gate__box" id="gateForm">
      <p class="gate__title">这座岛是锁着的</p>
      <p class="gate__sub">输入口令才能上岸</p>
      <input class="gate__input" id="gateInput" type="password" inputmode="text"
        autocomplete="off" placeholder="口令" aria-label="口令" />
      <button class="gate__go" type="submit">上岸</button>
      <p class="gate__err" id="gateErr"></p>
    </form>
  </div>

  <!-- 第一次来才出现：你是谁 -->
  <div class="first-run" id="firstRun" hidden>
    <p class="first-run__title" id="firstRunTitle">欢迎登陆WXQ的私人海滩</p>
    <p class="first-run__sub">先告诉我，屏幕前的你是——（只问这一次）</p>
    <div class="first-run__who">
      <button class="enter-btn" data-who="W" id="enterW">W</button>
      <button class="enter-btn" data-who="M" id="enterM">M</button>
    </div>
  </div>
  <p class="greeting" id="greeting" hidden></p>

  <!-- 海滩 -->
  <div class="stage" id="stage">
    <div class="sky"></div>
    <div class="stars" id="stars"></div>
    <div class="sun"></div>

    <div class="sea" id="sea"></div>
    <div class="foam"></div>
    <div class="wetline"></div>

    <div class="sand"></div>
    <div class="dune d1"></div><div class="dune d2"></div><div class="dune d3"></div>
    <div class="ripple-sand"></div>

    <div class="cabin" id="cabin">
      <span class="cabin__hint" hidden></span>
      <div class="cabin__lit"></div>
      <div class="cabin__roof"></div>
      <div class="cabin__eave"></div>
      <div class="cabin__body">
        <div class="cabin__inner"></div>
        <div class="cabin__posts"><i></i><i></i><i></i></div>
        <div class="lights" id="lights"></div>
      </div>
      <div class="cabin__deck"></div>
      <button class="cabin__hit" id="cabinHit" aria-label="看所有照片"></button>
    </div>

    <div class="greens" id="greens" hidden></div>

    <!-- 纯文字的分享：半掩在沙子里的贝壳 -->
    <div class="shells" id="shells"></div>

    <div class="mailbox has-mail" id="mailbox">
      <div class="mailbox__glow"></div>
      <span class="mailbox__hint">信箱</span>
      <div class="mailbox__post"></div>
      <div class="mailbox__box">
        <div class="mailbox__door"></div>
        <div class="mailbox__flag"></div>
      </div>
      <button class="mailbox__hit" id="mailboxHit" aria-label="打开信箱"></button>
    </div>

    <div class="pit" id="campfire">
      <div class="pit__glow"></div>
      <div class="pit__stones" id="stones"></div>
      <div class="pit__ring"></div>
      <div class="flame"></div><div class="flame flame--2"></div>
      <div class="smoke"></div><div class="smoke" style="animation-delay:-3.5s"></div>
      <div class="embers" id="embers"></div>
      <button class="fire-hit" id="fireBtn" aria-label="查看最新分享"></button>
      <span class="fire-hint" hidden></span>
    </div>

    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- 顶部工具条 -->
  <header class="topbar">
    <span></span>
    <button class="icon-btn" id="calendarBtn" aria-label="翻看以前的分享">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
    </button>
  </header>

  <button class="icon-btn sound-btn" id="soundBtn" aria-label="声音开关">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" id="soundIcon">
      <path d="M4 9v6h4l5 5V4L8 9H4Z"/><path d="M16 8a5 5 0 0 1 0 8"/>
    </svg>
  </button>

  <button class="fab" id="fabAdd" aria-label="分享点什么">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- 信：选项 → 封蜡信 → 展开阅读 -->
  <div class="veil" id="veil">
    <button class="veil__x" id="veilX" aria-label="关闭">✕</button>
    <div id="veilSlot"></div>
  </div>

  <!-- 篝火：最新分享 -->
  <div class="modal-backdrop" id="fireModalBackdrop">
    <div class="modal" style="position:relative">
      <button class="modal__close" id="fireModalClose" aria-label="关闭">✕</button>
      <div id="fireModalBody"></div>
    </div>
  </div>

  <!-- 日历 -->
  <div class="modal-backdrop calendar-overlay" id="calendarModalBackdrop">
    <div class="cal">
      <button class="modal__close" id="calendarModalClose" aria-label="关闭">✕</button>
      <div class="cal__head">
        <button class="cal__nav" id="calPrev" aria-label="上个月">‹</button>
        <span class="cal__label" id="calLabel"></span>
        <button class="cal__nav" id="calNext" aria-label="下个月">›</button>
      </div>
      <div class="cal__week">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal__grid" id="calGrid"></div>
      <div class="cal__day" id="calDay"></div>
    </div>
  </div>

  <!-- 发布新分享 -->
  <div class="modal-backdrop" id="postModalBackdrop">
    <div class="modal" style="position:relative">
      <button class="modal__close" id="postModalClose" aria-label="关闭">✕</button>
      <p class="modal__title">分享点什么</p>
      <form id="postForm">
        <div class="seg" role="tablist" aria-label="分享类型">
          <button type="button" class="seg__btn is-active" data-mode="text" id="modeText">只说一句话</button>
          <button type="button" class="seg__btn" data-mode="photo" id="modePhoto">发照片</button>
        </div>

        <div class="pick" id="pickRow" hidden>
          <button type="button" class="pick__btn" id="pickCamera">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
            现场拍
          </button>
          <button type="button" class="pick__btn" id="pickAlbum">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>
            从相册选
          </button>
        </div>
        <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden />
        <input type="file" id="fileAlbum" accept="image/*,image/gif" multiple hidden />
        <div class="thumbs" id="thumbs" hidden></div>

        <textarea id="postCaption" placeholder="想说的话…" rows="3" maxlength="300"></textarea>
        <div class="modal__actions">
          <button type="button" class="modal__cancel" id="postCancel">取消</button>
          <button type="submit" class="modal__submit" id="postSubmit">发布</button>
        </div>
        <p class="modal__hint" id="postHint"></p>
      </form>
    </div>
  </div>

  <!-- 大图查看 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightboxClose" aria-label="关闭">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="上一张">‹</button>
    <img class="lightbox__img" id="lightboxImg" alt="" />
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="下一张">›</button>
    <span class="lightbox__count" id="lightboxCount"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/scene.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
