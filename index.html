<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>写给你的地方</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="ember-field" aria-hidden="true">
    <span class="ember-dot"></span>
    <span class="ember-dot"></span>
    <span class="ember-dot"></span>
  </div>

  <header class="topbar">
    <div class="topbar__brand" id="brandTitle">写给你的地方</div>
    <nav class="topbar__nav">
      <button class="navtab is-active" data-tab="journal">日常</button>
      <button class="navtab" data-tab="wall">悄悄话</button>
    </nav>
  </header>

  <main>
    <!-- ============ 日常 ============ -->
    <section id="tab-journal" class="tab-panel is-active">
      <div class="letter">
        <p class="letter__eyebrow">写在最前面</p>
        <div id="openingLetter" class="letter__body"></div>
      </div>

      <div class="timeline" id="timeline">
        <!-- 由 app.js 动态生成 -->
      </div>
    </section>

    <!-- ============ 悄悄话 ============ -->
    <section id="tab-wall" class="tab-panel">
      <div class="wall">
        <p class="wall__eyebrow">这里的话，只有我们能看见</p>
        <div class="wall__feed" id="wallFeed">
          <p class="wall__empty" id="wallEmpty">还没有人说话，来写第一句吧。</p>
        </div>

        <form class="composer" id="composerForm">
          <div class="composer__who" role="radiogroup" aria-label="选择发言身份">
            <button type="button" class="who-btn is-active" data-sender="她" id="whoHer">她</button>
            <button type="button" class="who-btn" data-sender="我" id="whoMe">我</button>
          </div>
          <textarea
            id="composerInput"
            class="composer__input"
            placeholder="写点什么给对方…"
            maxlength="1000"
            rows="1"
          ></textarea>
          <button type="submit" class="composer__send" id="composerSend" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L20 4L13 20L11 13L4 12Z"/></svg>
          </button>
        </form>
        <p class="composer__hint" id="composerHint"></p>
      </div>
    </section>
  </main>

  <footer class="sitefoot">
    <span id="footerNote">只属于我们两个人的角落</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
